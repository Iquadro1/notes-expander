[project]
name = "notes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Isabella Inuso", email = "i.inuso@studenti.unipi.it" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.11",
    "pymupdf>=1.28.2",
    "rank-bm25>=0.2.2",
]

[project.scripts]
extract-refs = "src.extract:main"
search-refs = "src.search:main"
render-html = "src.render:main"
export-notes = "src.export_notes:main"
suggest-boxes = "src.suggest:main"
new-lesson = "src.new_lesson:main"
lint-md = "src.lint:main"
verify-html = "src.verify:main"
archive-lesson = "src.archive:main"
sync-docs = "src.sync_docs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
